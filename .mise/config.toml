[settings]
experimental = true
pin = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]
minimum_release_age = "12 hours"

[tools]
jactionlint = "v2.5.0"
gh = "2.103.3"
go = "1.27.3"
hadolint = "2.15.1"
jq = "1.8.2"
lefthook = "2.2.2"
node = "26.13.0"
oxfmt = "0.75.0"
regctl = "0.11.7"
shellcheck = "0.11.0"
yq = "4.54.2"

[tasks.local-build]
description = "Build and test the selected image"
usage = '''
arg "[variant]" default="main" {
    choices "main" "noml" "cuda" "openvino"
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
metadata=$(mktemp)
trap 'rm -f "$metadata"' EXIT
variant="${usage_variant?}"
inputs=$(bash .github/scripts/upstream-inputs.sh)
while IFS= read -r input; do
    export "$input"
done <<< "$inputs"
docker buildx bake --no-cache --metadata-file "$metadata" --load "image-${variant}-local"
image=$(jq -er --arg target "image-${variant}-local" '.[$target]."image.name" | sub("^docker.io/library/"; "")' "$metadata")
TEST_IMAGE="$image" VARIANT="$variant" go test -v ./tests/...
'''

[tasks.remote-build]
description = "Start the GitHub release workflow"
usage = '''
arg "[variant]" default="main" {
    choices "main" "noml" "cuda" "openvino" "all"
}
flag "--release" help="Publish the image"
'''
run = 'gh workflow run release.yaml -f variant="${usage_variant?}" -f release="${usage_release:-false}"'

[hooks]
postinstall = "lefthook install"
