[settings]
experimental = true
pin = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]
minimum_release_age = "12 hours"

[tools]
"aqua:jdx/jactionlint" = "2.3.0"
gh = "2.103.3"
go = "1.27.3"
hadolint = "2.15.1"
jq = "1.8.2"
lefthook = "2.2.2"
node = "26.13.0"
oxfmt = "0.75.0"
regctl = "0.11.7"
shellcheck = "0.11.0"
yq = "4.54.1"

[tasks.local-build]
description = "Build and test a variant locally"
usage = '''
arg "[variant]" help="variant (default: main)"
'''
run = '''
variant="${usage_variant:-main}"
env $(bash .github/scripts/upstream-inputs.sh) docker buildx bake --no-cache --metadata-file .cache/docker-bake.json --set=*.output=type=docker --load "image-${variant}-local"
TEST_IMAGE="$(jq -r --arg target "image-${variant}-local" '.[$target]."image.name" | sub("^docker.io/library/"; "")' .cache/docker-bake.json)" VARIANT="$variant" go test -v ./tests/...
'''

[tasks.remote-build]
description = "Trigger a remote build"
usage = '''
arg "[variant]" help="variant (default: main)"
arg "[release]" help="release flag (default: false)"
'''
run = 'gh workflow run release.yaml -f variant="${usage_variant:-main}" -f release="${usage_release:-false}"'

[hooks]
postinstall = ["mkdir -p {{config_root}}/.cache", "lefthook install"]
