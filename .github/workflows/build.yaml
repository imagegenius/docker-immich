---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  workflow_call:
    inputs:
      variant:
        type: string
        description: Variant name or all
        required: true
      no-cache:
        type: boolean
        description: Build without layer cache
        default: false
      release:
        type: boolean
        description: Release
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: $/.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      variant: ${{ inputs.variant }}
      no-cache: ${{ inputs.no-cache }}
      release: ${{ inputs.release }}

  publish:
    if: ${{ inputs.release }}
    name: Publish (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.build.outputs.variants) }}
    steps:
      - name: Download Bake Metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.variant }}-bake-metadata
          path: ${{ runner.temp }}

      - name: Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Manifest List and Push
        env:
          OWNER: ${{ github.repository_owner }}
          VARIANT: ${{ matrix.variant }}
          META: ${{ runner.temp }}/docker-metadata-action-bake.json
        run: |-
          args=()
          while read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.target."docker-metadata-action".tags[]' "$META")
          for file in "$RUNNER_TEMP/digests/$VARIANT/"*; do
            digest=$(cat "$file")
            args+=("ghcr.io/$OWNER/immich@$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect Image
        env:
          OWNER: ${{ github.repository_owner }}
          META: ${{ runner.temp }}/docker-metadata-action-bake.json
        run: |-
          TAG=$(jq --raw-output '.target."docker-metadata-action".args.DOCKER_META_VERSION' "$META")
          docker buildx imagetools inspect "ghcr.io/$OWNER/immich:$TAG"

      - name: Export Digest
        id: digest
        env:
          OWNER: ${{ github.repository_owner }}
          META: ${{ runner.temp }}/docker-metadata-action-bake.json
        run: |-
          TAG=$(jq --raw-output '.target."docker-metadata-action".args.DOCKER_META_VERSION' "$META")
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/$OWNER/immich:$TAG" --format '{{ json . }}' | jq --raw-output '.manifest.digest')
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"

      - name: Upload Dependency Snapshot
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          dependency-snapshot: true
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          image: ghcr.io/${{ github.repository_owner }}/immich@${{ steps.digest.outputs.digest }}

      - name: Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/immich
          subject-digest: ${{ steps.digest.outputs.digest }}

      - name: Verify Attestation
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |-
          gh attestation verify --repo "$REPO" "oci://ghcr.io/${{ github.repository_owner }}/immich@${DIGEST}"
