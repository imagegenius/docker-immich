---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Pull Request

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: $/.github/workflows/build-image.yaml
    permissions:
      contents: read
    with:
      variant: all
      release: false

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          experimental: true
          install_args: --locked aqua:jdx/jactionlint

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online --shellcheck= --format github

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - build
      - workflow-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 210
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
